name: Build and Release

# Manual only — this must never run on push/commit. A maintainer picks the
# new version number and triggers it explicitly from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g. 1.2.0, no leading "v")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version input
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Version '$version' must look like MAJOR.MINOR.PATCH, e.g. 1.2.0"
            exit 1
          }

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Update version numbers
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"

          # version.go — embedded into the built exe.
          $versionGoPath = 'version.go'
          $versionGo = Get-Content $versionGoPath -Raw
          $versionGo = $versionGo -replace 'var Version = "[^"]*"', "var Version = `"$version`""
          Set-Content -Path $versionGoPath -Value $versionGo -NoNewline

          # browser-extension/manifest.json — "version" field.
          $manifestPath = 'browser-extension/manifest.json'
          $manifest = Get-Content $manifestPath -Raw
          $manifest = $manifest -replace '"version":\s*"[^"]*"', "`"version`": `"$version`""
          Set-Content -Path $manifestPath -Value $manifest -NoNewline

          # installer/Cargo.toml — package version and file-version metadata.
          $cargoPath = 'installer/Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $cargo = $cargo -replace '(?m)^version = "[^"]*"', "version = `"$version`""
          $cargo = $cargo -replace '(?m)^file-version = "[^"]*"', "file-version = `"$version.0`""
          Set-Content -Path $cargoPath -Value $cargo -NoNewline

          # installer/src/lib.rs — DisplayVersion shown in Add/Remove Programs.
          $libRsPath = 'installer/src/lib.rs'
          $libRs = Get-Content $libRsPath -Raw
          $libRs = $libRs -replace 'set_value\("DisplayVersion", &"[^"]*"\)', "set_value(`"DisplayVersion`", &`"$version`")"
          Set-Content -Path $libRsPath -Value $libRs -NoNewline

      - name: Commit version bump
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.go browser-extension/manifest.json installer/Cargo.toml installer/src/lib.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No version changes to commit."
          } else {
            git commit -m "chore: bump version to ${{ inputs.version }}"
            git push
          }

      - name: Convert icon (PNG -> ICO)
        run: go run ./tools/mkico FpbxCTC.png FpbxCTC.ico

      - name: Generate browser extension icons
        run: go run ./tools/mkicons FpbxCTC.png browser-extension/icons

      - name: Embed icon into exe
        run: go run github.com/akavel/rsrc@latest -ico FpbxCTC.ico -o rsrc.syso

      - name: Tidy dependencies
        run: go mod tidy

      - name: Build FpbxCTC.exe
        run: go build -ldflags "-H windowsgui -s -w -X main.Version=${{ inputs.version }}" -o FpbxCTC.exe .

      - name: Package release archive
        shell: pwsh
        run: |
          Compress-Archive -Path FpbxCTC.exe, browser-extension -DestinationPath "FpbxCTC-${{ inputs.version }}.zip" -Force

      - name: Create and push tag
        shell: pwsh
        run: |
          $tag = "v${{ inputs.version }}"
          git tag $tag
          git push origin $tag

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          generate_release_notes: true
          files: |
            FpbxCTC.exe
            FpbxCTC-${{ inputs.version }}.zip
